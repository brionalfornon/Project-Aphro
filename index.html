<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Aphrodite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="dark-overlay"></div>

    <div id="intro-container">
        <h1 id="text1" class="intro-text">Hello Jean!</h1>
        <h1 id="text2" class="intro-text">Welcome to my little project</h1>
        <h1 id="text3" class="intro-text">This is our 3rd Year Anniversary!</h1>
        <h1 id="text4" class="intro-text">and I just have one question...</h1>
    </div>

    <div id="question-container" class="hidden">
        <img src="./gif/dudu.gif" alt="Cute Bears" class="cute-gif">
        
        <h2 class="question">Do you love me?</h2>
        
        <div class="button-container">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
        
        <p id="subtext">you don't have much of a choice :DD</p>
    </div>

    <div id="scroll-wrapper" class="hidden">
        
        <div id="final-container">
            <div id="bigHeart" class="heart"></div>
            <h1>Brion X Jean</h1>
            <h2>Happy Anniversary! ❤️</h2>
        </div>

        <div id="image-track">
            </div>

        <div id="tbc-container">
            <h1 id="tbc-text" class="to-be-continued">I Love You, Lil Bech!</h1>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
