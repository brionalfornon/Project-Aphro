<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- External JavaScript -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Background Image -->
    <div class="hero-background"></div>

    <!-- Intro Text Sequence -->
    <div class="intro-container" id="introContainer">
        <!-- Sequence 1 -->
        <div class="sequence-text text-1">1,095 days.</div>
        
        <!-- Sequence 2 -->
        <div class="sequence-text text-2">26,280 hours.</div>
        
        <!-- Sequence 3 -->
        <div class="sequence-text text-3">But who's counting?</div>
        
        <!-- Final Reveal -->
        <div class="final-text text-4">Happy 3rd Anniversary.</div>

        <!-- Call to Action -->
        <div class="scroll-indicator">Click anywhere to begin</div>
    </div>

    <!-- New Timeline/Years Section -->
    <div class="timeline-container" id="timelineContainer">
        <h2 class="timeline-title">Choose a Chapter</h2>
        <div class="year-buttons">
            <button class="year-btn">2024</button>
            <button class="year-btn">2025</button>
            <button class="year-btn">2026</button>
        </div>
    </div>

</body>
</html>
